[project]
name = "halo-gtk"
version = "0.1.0"
description = "Native GTK4 + libadwaita Linux desktop app for Ring home security"
authors = [{ name = "JamesFromFL" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["gtk", "linux", "ring", "security-camera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    # Pure-Python packages — managed by uv
    # Halo patches the 0.9.14 WebRTC close contract; validate before widening.
    "ring-doorbell==0.9.14",
    # HTTP client APIs used directly and by ring-doorbell
    "aiohttp>=3.14.4",
    "requests>=2.32",
    # Halo patches aiortc 1.15.0 internals; validate any upgrade before widening.
    "aiortc==1.15.0",
    # Live stream frame conversion/padding via PyAV VideoFrame.to_ndarray().
    "numpy>=1.26",
    "Pillow>=13.0.0",
    # PyAV — first-frame decode from Ring recording URLs for motion-off tiles.
    # Validated with aiortc 1.15.0 and the threads=1 RGB conversion API.
    # PyAV 19 requires Python 3.12 and is outside aiortc's supported range.
    "av==17.1.0",
]
# ---------------------------------------------------------------------------
# Required system packages (Arch Linux) — NOT managed by uv
# Install with: sudo pacman -S python-gobject gtk4 libadwaita libnotify libsecret
#
# These are GObject introspection libraries that must come from pacman.
# Create the venv with system site-packages so `gi` is visible:
#   uv venv --system-site-packages && uv sync
# ---------------------------------------------------------------------------

[project.scripts]
halo-gtk = "halo_gtk.__main__:main"

[project.urls]
Homepage = "https://github.com/JamesFromFL/halo-gtk"
Issues = "https://github.com/JamesFromFL/halo-gtk/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_gtk"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.codex",
    "/.internal",
    "/data/gschemas.compiled",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]
audit = [
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length    = 100
target-version = "py311"
src            = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.uv]
required-version = "==0.11.24"
