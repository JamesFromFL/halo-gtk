name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --no-group audit
      - run: .venv/bin/ruff check --no-cache src tests scripts
      - run: .venv/bin/ruff format --check --no-cache src tests scripts
      - name: Check locked Flatpak dependency sources
        run: .venv/bin/python scripts/flatpak_dependencies.py --check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --only-group audit
      - name: Export locked production dependencies
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-group audit \
            --no-emit-project \
            --output-file /tmp/halo-requirements.txt
      - name: Audit locked production dependencies
        # Review exact package/version/advisory exceptions without filtering the
        # raw report. All other findings and incomplete results fail closed.
        run: |
          uv run --frozen --only-group audit python scripts/audit_dependencies.py \
            --requirements /tmp/halo-requirements.txt \
            --report dependency-audit.json
      - name: Preserve raw dependency audit
        # This exact report contains the public PyPI dependencies exported above;
        # the local project is excluded. Retain it with this repository's CI run.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - run: uv lock --check
      - name: Install GTK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-adw-1 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gtk-4.0 \
            gir1.2-notify-0.7 \
            gir1.2-secret-1 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libsecret-1-0 \
            python3-gi
      - run: uv venv --python /usr/bin/python3 --system-site-packages
      - run: uv sync --frozen --no-group audit
      - run: .venv/bin/pytest -q -p no:cacheprovider

  native-desktop:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 25
    steps:
      - name: Install the desktop and media runtime
        run: |
          pacman -Syu --noconfirm --needed git python python-gobject gtk4 libadwaita \
            libnotify libsecret gst-plugin-gtk4 gst-plugins-good gst-libav
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
      - run: uv lock --check
      - run: uv venv --python /usr/bin/python3 --system-site-packages
      - run: uv sync --frozen --no-group audit
      - run: scripts/ci_native_tests.sh

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
      - run: uv lock --check
      - run: uv sync --frozen --no-group audit --python ${{ matrix.python }}
      - name: Check the supported Python endpoints
        run: |
          .venv/bin/python -m compileall -q src scripts
          .venv/bin/pytest -q -p no:cacheprovider tests/test_alarm_models.py tests/test_log_redaction.py tests/test_alarm_protocol.py

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true
      - run: uv lock --check
      - name: Install GTK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-adw-1 \
            gir1.2-gdkpixbuf-2.0 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gtk-4.0 \
            gir1.2-notify-0.7 \
            gir1.2-secret-1 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libsecret-1-0 \
            python3-gi
      - run: uv venv --python /usr/bin/python3 --system-site-packages
      - run: uv sync --frozen --no-group audit
      - run: .venv/bin/python scripts/ci_import_check.py
      - run: .venv/bin/python -m compileall -q src tests scripts
      - run: glib-compile-schemas --strict --dry-run data
      - run: desktop-file-validate data/io.github.JamesFromFL.HaloGtk.desktop
      - name: Build artifacts
        run: uv build --out-dir dist
      - name: Export locked production dependencies
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-group audit \
            --no-emit-project \
            --output-file /tmp/halo-runtime-requirements.txt
      - name: Smoke test installed wheel
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages /tmp/halo-artifact-venv
          uv pip install \
            --python /tmp/halo-artifact-venv/bin/python \
            --require-hashes \
            --requirements /tmp/halo-runtime-requirements.txt
          uv pip install \
            --python /tmp/halo-artifact-venv/bin/python \
            --no-deps \
            dist/*.whl
          uv pip check --python /tmp/halo-artifact-venv/bin/python
          /tmp/halo-artifact-venv/bin/python scripts/ci_import_check.py --installed
      - name: Record artifact identity
        run: |
          printf 'commit=%s\n' "$GITHUB_SHA" > dist/BUILD-INFO
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          cat dist/BUILD-INFO dist/SHA256SUMS
